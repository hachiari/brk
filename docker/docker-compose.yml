name: bitview

services:
  bitview:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bitview:latest
    container_name: bitview
    restart: unless-stopped
    ports:
      - 7070:3110
    volumes:
      - ${BITCOIN_DATA_DIR:-/path/to/bitcoin}:/bitcoin:ro
      - ${BITVIEW_DATA_VOLUME:-bitview-data}:/home/bitview/.bitview
      # Bind mount alternative (uncomment and set BITVIEW_DATA_DIR in .env):
      # - ${BITVIEW_DATA_DIR:-./bitview-data}:/home/bitview/.bitview
    command:
      - --bitcoindir
      - /bitcoin
      - --blocksdir
      - /bitcoin/blocks
      - --bitviewdir
      - /home/bitview/.bitview
      - --rpcconnect
      - "${BTC_RPC_HOST:-localhost}"
      - --rpcuser
      - "${BTC_RPC_USER:-bitcoin}"
      - --rpcpassword
      - "${BTC_RPC_PASSWORD:-bitcoin}"
      # Cookie file alternative (uncomment and remove rpcuser/rpcpassword above):
      # - --rpccookiefile
      # - /bitcoin/.cookie
    healthcheck:
      # Liveness + freshness. `pgrep bitviewd` only proves the process exists --
      # it reported healthy for 40 min once while the server could not reach the
      # node. Instead: open the HTTP API on :3110 (liveness), require a 200
      # (serving), and assert the chain tip it reports is < 3h old (freshness),
      # so a frozen-but-serving sync -- stale MVRV/SOPR under a plausible read --
      # shows unhealthy instead of lying. Pure bash /dev/tcp: no curl, no image
      # rebuild (runtime image already ships bash + coreutils date).
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/3110 || exit 1; printf 'GET /api/vecs/query?index=height&ids=timestamp&from=-1 HTTP/1.0\\r\\nConnection: close\\r\\n\\r\\n' >&3; r=$(cat <&3); echo $r | grep -q '200 OK' || exit 1; t=$(echo $r | grep -oE '[0-9]{9,}' | tail -1); t=${t:-0}; [ $(( $(date +%s) - t )) -lt 10800 ]"
      interval: 60s
      timeout: 15s
      retries: 3
      # Generous so a restart's catch-up (or a slow block) never flaps. A cold
      # 290 GiB reprocess runs longer than this and will read unhealthy until the
      # first tip lands -- correct, but bump this if you ever rebuild from zero.
      start_period: 15m

volumes:
  bitview-data:
    driver: local

# Join the network Bitcoin Core is already on, instead of an isolated per-project
# network. Reaching bitcoind through the host gateway instead makes bitcoind see
# the connection as 127.0.0.1 and it fails auth; electrs (which works) sits on
# this same network and talks to bitcoind container-to-container.
# Override BRK_NETWORK if the node lives somewhere else.
networks:
  default:
    name: ${BRK_NETWORK:-dokploy-network}
    external: true
